<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Kroma Vance</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://kromavance.com/thank-you">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .ty-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:32px;}
  .ty-card{max-width:480px;}
  .ty-check{width:64px; height:64px; border-radius:50%; background:var(--violet-tint); color:var(--violet); display:flex; align-items:center; justify-content:center; margin:0 auto 24px; font-size:30px;}
  .ty-card h1{font-size:clamp(28px,4vw,38px); margin-bottom:14px;}
  .ty-card p{color:var(--muted); font-size:16px; line-height:1.6; margin-bottom:30px;}
</style>
</head>
<body>
  <div class="ty-wrap">
    <div class="ty-card">
      <div class="ty-check">&#10003;</div>
      <h1>Message Received.</h1>
      <p>Thanks for reaching out — I read every message myself and usually reply within a business day. Talk soon.</p>
      <a href="/" class="btn">Back To The Homepage</a>
    </div>
  </div>
</body>
</html>
